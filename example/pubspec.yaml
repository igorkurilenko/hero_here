name: example
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  hero_here:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # For the frame times on a device: integration_test/perf_test.dart.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # The flippers photo from Flutter's hero animations guide. Its license
    # is images/LICENSE.
    - images/flippers.png

  # Geist, the examples' type, as rose_app's. Its license is
  # assets/fonts/OFL.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
